<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ValveSelect — Inga Electronics</title>
<style>
:root{
  --ink:#132027;
  --ink-soft:#3d4d55;
  --paper:#EEF1EF;
  --panel:#FFFFFF;
  --panel-alt:#F4F6F5;
  --line:#D7DEDB;
  --line-strong:#B7C2BE;
  --teal:#0E7C7B;
  --teal-dark:#0A5F5E;
  --teal-tint:#E2F1F0;
  --brass:#B8863B;
  --brass-tint:#F6ECD9;
  --amber:#C97A2B;
  --amber-tint:#FBEDDC;
  --red:#B3261E;
  --red-tint:#FBE7E5;
  --green:#1F7A4D;
  --green-tint:#E5F3EB;
  --radius:3px;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  --sans: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
@font-face{font-family:'IBM Plex Sans';src:local('Segoe UI');}
#app{min-height:100vh;display:flex;flex-direction:column;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;background:var(--ink);color:#fff;
  border-bottom:3px solid var(--teal);
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.brand-logo{width:46px;height:46px;border-radius:50%;flex:none;object-fit:cover;}
.brand .mark{
  width:26px;height:26px;border:2px solid var(--teal);border-radius:50%;
  position:relative;flex:none;
}
.brand .mark::after{
  content:'';position:absolute;top:50%;left:50%;width:12px;height:12px;
  background:var(--teal);border-radius:1px;transform:translate(-50%,-50%) rotate(45deg);
}
.brand .name{font-weight:600;font-size:19px;letter-spacing:0.2px;}
.brand .tag{font-size:14px;font-weight:600;color:#9FB2B0;font-family:var(--mono);}
.topbar-right{display:flex;align-items:center;gap:18px;font-size:12.5px;color:#C7D3D1;}
.topbar-right b{color:#fff;}

/* ---------- Layout ---------- */
.shell{flex:1;display:flex;min-height:0;}
.rail{
  width:230px;flex:none;background:var(--panel-alt);
  border-right:1px solid var(--line);padding:20px 0;
  display:flex;flex-direction:column;
}
.rail.hide{display:none;}
.rail-step{
  padding:10px 22px;font-size:12.5px;color:var(--ink-soft);
  border-left:3px solid transparent;display:flex;gap:10px;align-items:center;
  cursor:default;position:relative;
}
.rail-step .num{
  width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;font-size:10px;
  font-family:var(--mono);flex:none;color:var(--ink-soft);
}
.rail-step.active{border-left-color:var(--teal);background:var(--teal-tint);color:var(--ink);font-weight:600;}
.rail-step.active .num{background:var(--teal);border-color:var(--teal);color:#fff;}
.rail-step.done{color:var(--ink);cursor:pointer;}
.rail-step.done .num{background:var(--ink);border-color:var(--ink);color:#fff;}
.rail-step.done:hover{background:var(--panel);}

.main{flex:1;overflow-y:auto;padding:32px 40px 110px;}
.main.narrow{max-width:900px;margin:0 auto;}
.wrap{max-width:1040px;margin:0 auto;}

/* ---------- Typography ---------- */
h1{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-0.2px;}
h2{font-size:17px;font-weight:600;margin:0 0 4px;}
.subtitle{color:var(--ink-soft);font-size:13.5px;margin:0 0 26px;}
.section-label{
  font-family:var(--mono);font-size:11px;color:var(--teal-dark);
  margin:0 0 10px;letter-spacing:0.3px;
}

/* ---------- Home screen ---------- */
.home-hero{
  background:var(--ink);color:#fff;padding:36px 40px;margin:-32px -40px 32px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
  border-bottom:3px solid var(--teal);
}
.home-hero h1{font-size:26px;color:#fff;}
.home-hero .sub{color:#AEC0BE;font-size:13.5px;max-width:480px;}
.home-hero .cta{
  background:var(--teal);color:#fff;border:none;padding:13px 22px;font-size:14px;
  font-weight:600;border-radius:var(--radius);cursor:pointer;flex:none;
}
.home-hero .cta:hover{background:var(--teal-dark);}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
.grid.tools{grid-template-columns:repeat(2,1fr);}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;cursor:pointer;transition:border-color .12s;
}
.card:hover{border-color:var(--teal);}
.card .icon{
  width:32px;height:32px;border:1.5px solid var(--ink);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:14px;
}
.card h3{font-size:14.5px;margin:0 0 6px;font-weight:600;}
.card p{margin:0;font-size:12.5px;color:var(--ink-soft);}
.card .count{font-family:var(--mono);font-size:11px;color:var(--brass);margin-top:8px;display:block;}

/* ---------- Buttons / form ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#fff;
  border:none;padding:11px 20px;font-size:13.5px;font-weight:600;border-radius:var(--radius);
  cursor:pointer;font-family:var(--sans);
}
.btn:hover{background:var(--teal-dark);}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line-strong);}
.btn.secondary:hover{border-color:var(--ink);}
.btn.ghost{background:transparent;color:var(--teal-dark);border:none;padding:8px 4px;}
.btn:disabled{background:#C6CDCB;cursor:not-allowed;color:#8A9491;}
.btn-row{display:flex;justify-content:space-between;margin-top:32px;padding-top:20px;border-top:1px solid var(--line);}

label.field{display:block;margin-bottom:18px;}
label.field .lab{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--ink);}
label.field .hint{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--radius);
  font-size:13.5px;font-family:var(--sans);background:#fff;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
.unit-toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;margin-left:10px;vertical-align:middle;}
.unit-toggle button{
  border:none;background:#fff;padding:5px 10px;font-size:11.5px;font-family:var(--mono);
  cursor:pointer;color:var(--ink-soft);
}
.unit-toggle button.active{background:var(--ink);color:#fff;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.field-row.three{grid-template-columns:1fr 1fr 1fr;}

/* ---------- Option tiles (valve type / function) ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.tile{
  border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;
  background:#fff;text-align:left;
}
.tile:hover{border-color:var(--teal);}
.tile.selected{
  border-color:var(--teal);
  background:var(--teal-tint);
  box-shadow:0 0 0 2px var(--teal),0 6px 18px rgba(14,124,123,.14);
  transform:translateY(-1px);
}
.tile.selected h4{color:var(--teal-dark);}
.tile.selected::after{
  content:'✓ Selected';display:inline-block;margin-top:12px;
  font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--teal-dark);
  background:#fff;border:1px solid var(--teal);padding:3px 8px;border-radius:10px;
}
.tile:focus{outline:2px solid var(--teal);outline-offset:2px;}
.tile .glyph{font-size:22px;margin-bottom:10px;display:block;}
.tile h4{margin:0 0 4px;font-size:14px;font-weight:600;}
.tile p{margin:0;font-size:12px;color:var(--ink-soft);}
.tile .fit{
  display:inline-block;margin-top:10px;font-family:var(--mono);font-size:10.5px;
  padding:2px 7px;border-radius:10px;
}
.fit.Excellent{background:var(--green-tint);color:var(--green);}
.fit.Good{background:var(--teal-tint);color:var(--teal-dark);}
.fit.Fair{background:var(--amber-tint);color:var(--amber);}
.fit.Poor{background:var(--red-tint);color:var(--red);}

/* ---------- Medium search ---------- */
.search-box{position:relative;margin-bottom:8px;}
.search-box input{padding-left:38px;font-size:15px;padding-top:13px;padding-bottom:13px;}
.search-box .sicon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);}
.suggest-list{border:1px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius);background:#fff;max-height:360px;overflow-y:auto;}
.suggest-item{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.suggest-item:last-child{border-bottom:none;}
.suggest-item:hover{background:var(--panel-alt);}
.suggest-item .nm{font-weight:600;font-size:13.5px;}
.suggest-item .meta{font-size:11px;color:var(--ink-soft);font-family:var(--mono);}
.suggest-item .cat{font-size:11px;color:var(--brass);text-transform:none;}
.no-match{padding:22px 16px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line-strong);border-radius:var(--radius);margin-top:6px;}
.no-match .btn{margin-top:12px;}

/* ---------- badges / chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 10px;border-radius:12px;font-family:var(--mono);}
.chip.hazard{background:var(--red-tint);color:var(--red);}
.chip.info{background:var(--panel-alt);color:var(--ink-soft);border:1px solid var(--line);}

/* ---------- Results / candidate cards ---------- */
.results-summary{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;
  margin-bottom:24px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;
}
.results-summary .item .k{font-size:10.5px;color:var(--ink-soft);font-family:var(--mono);text-transform:uppercase;}
.results-summary .item .v{font-size:13.5px;font-weight:600;margin-top:2px;}

.cost-banner{background:var(--green-tint);border:1px solid #B9DCC8;border-left:4px solid var(--green);padding:14px 18px;border-radius:var(--radius);margin-bottom:18px;display:flex;justify-content:space-between;gap:18px;align-items:center;}
.cost-banner .cost-title{font-weight:700;font-size:13.5px;}
.cost-banner .cost-detail{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.cost-badge{display:inline-flex;align-items:center;gap:5px;background:var(--green-tint);color:var(--green);border:1px solid #B9DCC8;border-radius:12px;padding:3px 9px;font-family:var(--mono);font-size:10.5px;white-space:nowrap;}

.candidate{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;
  display:flex;gap:24px;align-items:flex-start;
}
.candidate.top{border-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal);}
.candidate .score-wrap{flex:none;width:86px;text-align:center;}
.score-ring{
  width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:18px;margin:0 auto 6px;border:4px solid var(--line);
}
.score-ring.s-high{border-color:var(--green);color:var(--green);}
.score-ring.s-mid{border-color:var(--amber);color:var(--amber);}
.score-ring.s-low{border-color:var(--red);color:var(--red);}
.score-cap{font-size:9.5px;color:var(--ink-soft);font-family:var(--mono);}
.candidate .body{flex:1;}
.rec-tag{
  display:inline-block;font-family:var(--mono);font-size:10.5px;background:var(--teal);color:#fff;
  padding:3px 9px;border-radius:10px;margin-bottom:8px;
}
.candidate h3{margin:0 0 4px;font-size:16px;}
.candidate .spec-line{font-size:12.5px;color:var(--ink-soft);font-family:var(--mono);margin-bottom:12px;}
.check-grid{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:6px;}
.check{font-size:12px;display:flex;align-items:center;gap:6px;}
.check.ok{color:var(--green);}
.check.warn{color:var(--amber);}
.check.bad{color:var(--red);}
.candidate .actions{display:flex;gap:10px;margin-top:14px;}
.candidate .actions .btn,.candidate .actions .btn.secondary{padding:8px 14px;font-size:12.5px;}
label.compare-check{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);margin-top:14px;}

/* ---------- Why panel ---------- */
.why-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:0;margin-bottom:16px;overflow:hidden;}
.why-section{padding:18px 24px;border-bottom:1px solid var(--line);}
.why-section:last-child{border-bottom:none;}
.why-section h4{margin:0 0 12px;font-size:12.5px;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-soft);font-family:var(--mono);font-weight:600;}
.why-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px;border-bottom:1px dashed var(--line);}
.why-row:last-child{border-bottom:none;}
.why-row .lbl{color:var(--ink-soft);}
.why-row .val{font-family:var(--mono);font-weight:600;}
.why-verdict{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:4px;}
.why-verdict.ok{color:var(--green);}
.why-verdict.warn{color:var(--amber);}
.why-verdict.bad{color:var(--red);}
.why-section.risk{background:var(--amber-tint);}
.score-formula{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);background:var(--panel-alt);padding:12px 16px;border-radius:var(--radius);margin-top:10px;}

/* ---------- Spec sheet ---------- */
.spec-table{width:100%;border-collapse:separate;border-spacing:0 7px;margin-bottom:24px;}
.spec-table tr{background:var(--surface-2);}
.spec-table td{padding:11px 14px;font-size:13px;vertical-align:top;}
.spec-table td:first-child{color:var(--ink-soft);width:34%;font-weight:600;border-radius:8px 0 0 8px;white-space:nowrap;}
.spec-table td:last-child{font-family:var(--mono);font-weight:600;border-radius:0 8px 8px 0;line-height:1.5;}
.spec-table .value-main{display:block;}
.spec-table .value-note{display:block;margin-top:3px;color:var(--ink-soft);font-family:var(--sans);font-size:11.5px;font-weight:500;}
.report-doc .spec-table{border-spacing:0 5px;}
.report-doc .spec-table td{padding:9px 12px;}
.spec-section-title{margin-top:28px!important;margin-bottom:8px!important;}

/* ---------- Compare table ---------- */
.compare-table-wrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#fff;}
.compare-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;}
.compare-table th,.compare-table td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:11px 14px;font-size:12.5px;text-align:left;vertical-align:top;white-space:nowrap;}
.compare-table th:last-child,.compare-table td:last-child{border-right:none;}
.compare-table thead th{background:var(--panel-alt);font-family:var(--mono);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-soft);position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line-strong);}
.compare-table thead th.colhead{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);}
.compare-table thead th.corner{position:sticky;left:0;top:0;z-index:3;}
.compare-table td.rowlabel,.compare-table th.corner{color:var(--ink-soft);font-weight:600;background:var(--panel-alt);width:180px;min-width:180px;position:sticky;left:0;z-index:1;border-right:1px solid var(--line-strong);white-space:normal;}
.compare-table tbody tr:nth-child(even) td{background:var(--panel-alt);}
.compare-table tbody tr:nth-child(even) td.rowlabel{background:var(--panel-alt);}
.compare-table tbody tr:last-child td{border-bottom:none;}
.compare-table td.best-col,.compare-table th.best-col{background:var(--teal-tint)!important;}
.compare-table td.rowlabel.best-col{background:var(--panel-alt)!important;}
.compare-table .cand-name{font-weight:700;font-size:13px;}
.compare-table .cand-sub{font-family:var(--mono);font-weight:500;font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
.compare-table .best-badge{display:inline-block;margin-top:5px;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.3px;color:#fff;background:var(--teal);padding:2px 7px;border-radius:9px;}
.compare-table .score-val{font-family:var(--mono);font-weight:700;font-size:13.5px;}
.compare-table .pf{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-weight:600;font-size:11.5px;padding:3px 8px;border-radius:10px;}
.compare-table .pf.ok{color:var(--green);background:var(--green-tint);}
.compare-table .pf.bad{color:var(--red);background:var(--red-tint);}
.compare-table .rating-val{font-weight:600;}

/* ---------- Disclaimer / report ---------- */
.disclaimer{
  background:var(--amber-tint);border:1px solid #E6C89A;border-left:4px solid var(--amber);
  padding:16px 20px;border-radius:var(--radius);font-size:12.5px;color:#6b4718;margin:24px 0;
}
.disclaimer b{display:block;margin-bottom:4px;font-size:13px;}
 .contact-box{background:var(--panel-alt);border:1px solid var(--line);padding:14px 16px;border-radius:var(--radius);font-size:12.5px;color:var(--ink-soft);margin:20px 0;}
.contact-box b{color:var(--ink);}
.contact-box a{color:var(--teal-dark);font-weight:700;text-decoration:none;}
.report-contact{border-top:1px solid var(--line);margin-top:28px;padding-top:16px;font-size:11.5px;color:var(--ink-soft);line-height:1.6;}
.report-doc{background:#fff;border:1px solid var(--line);padding:40px;max-width:760px;margin:0 auto;}
.report-doc h1{font-size:20px;}
.report-doc .rhead{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px;}
.report-doc .rhead .co{font-size:11px;color:var(--ink-soft);font-family:var(--mono);}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(19,32,39,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:#fff;border-radius:var(--radius);max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:28px 30px;}
.modal h2{margin-bottom:16px;}
.modal-close{float:right;background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}

/* ---------- Toast ---------- */
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:13px 20px;border-radius:var(--radius);font-size:13px;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.2);}

/* ---------- misc ---------- */
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.empty-state .glyph{font-size:34px;margin-bottom:14px;}
.link{color:var(--teal-dark);cursor:pointer;text-decoration:underline;font-size:12.5px;}
table.calc-table{width:100%;}
table.calc-table td{padding:6px 0;}
.calc-result{background:var(--teal-tint);border-radius:var(--radius);padding:14px 16px;margin-top:14px;font-family:var(--mono);font-size:14px;color:var(--teal-dark);font-weight:700;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px;}
/* ---------- Bottom navigation bar ---------- */
.bottom-nav{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  display:flex;align-items:center;justify-content:center;gap:22px;
  background:#fff;border:1px solid var(--line);border-radius:999px;
  box-shadow:0 10px 28px rgba(19,32,39,.16),0 2px 6px rgba(19,32,39,.08);
  padding:10px 30px;z-index:40;
  width:min(560px,calc(100% - 40px));
}
.bottom-nav .nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  flex:1;padding:9px 20px;border-radius:999px;cursor:pointer;
  color:var(--ink-soft);user-select:none;transition:background .15s,color .15s;
}
.bottom-nav .nav-item:hover{background:var(--panel-alt);}
.bottom-nav .nav-item .nav-icon{font-size:18px;line-height:1;}
.bottom-nav .nav-item .nav-label{font-size:11px;font-weight:600;letter-spacing:.2px;}
.bottom-nav .nav-item.active{background:var(--teal-tint);color:var(--teal-dark);}
@media (max-width:640px){
  .bottom-nav{bottom:14px;padding:8px 14px;gap:4px;width:calc(100% - 24px);}
  .bottom-nav .nav-item{padding:8px 6px;}
}
@media print{
  .rail,.topbar,.btn-row,.no-print,.bottom-nav{display:none !important;}
  .main{padding:0;}
}
</style>
</head>
<body>
<div id="app"></div>

function matName(kind,code){ const m=MATERIALS[kind].find(x=>x.code===code); return m?m.name:code; }
function matTemp(kind,code){ const m=MATERIALS[kind].find(x=>x.code===code); return m?m.tempLimitC:0; }

// Given a medium, rank the body/seat/seal material options by their chemical
// compatibility rating with that medium (highest rating first). Only options
// that appear in the source chart (i.e. have a defined rating) are returned.
function rankedMaterialsForMedia(media, kind){
  return MATERIALS[kind]
    .map(mat=>({code:mat.code, name:mat.name, rating:media.compat[mat.code]}))
    .filter(x=>x.rating!==undefined)
    .sort((a,b)=>b.rating-a.rating);
}
function bestMaterialsForMedia(media){
  return {
    body: rankedMaterialsForMedia(media,'body'),
    seat: rankedMaterialsForMedia(media,'seat'),
    seal: rankedMaterialsForMedia(media,'seal'),
  };
}

// Simplified pressure classes: rating in bar @ 20C, plus a per-material-category derating slope (bar lost per °C above 20C)
const PRESSURE_CLASSES = [
  {code:'PN6',  standard:'DIN/EN', bar20:6},
  {code:'PN10', standard:'DIN/EN', bar20:10},
  {code:'PN16', standard:'DIN/EN', bar20:16},
  {code:'PN25', standard:'DIN/EN', bar20:25},
  {code:'PN40', standard:'DIN/EN', bar20:40},
  {code:'CL150',standard:'ASME',   bar20:19},
  {code:'CL300',standard:'ASME',   bar20:50},
];
const DERATE_SLOPE = { metal: 0.018, plastic: 0.14 }; // bar per degree C above 20, applied against body material category

function ratedPressureAtTemp(classCode, bodyMaterialCode, tempC){
  const cls = PRESSURE_CLASSES.find(c=>c.code===classCode);
  const mat = MATERIALS.body.find(m=>m.code===bodyMaterialCode);
  if(!cls || !mat) return 0;
  const slope = DERATE_SLOPE[mat.category] || 0.05;
  const over = Math.max(0, tempC-20);
  const rated = cls.bar20 - slope*over;
  return Math.max(0, Math.round(rated*10)/10);
}

/* ---------------------------- UNIT CONVERSIONS ---------------------------- */
const Convert = {
  cToF:c=>c*9/5+32, fToC:f=>(f-32)*5/9,
  barToPsi:b=>b*14.5038, psiToBar:p=>p/14.5038,
  dnToNps:dn=>{ const s=SIZES.find(s=>s.dn===dn); return s?s.nps:dn+' mm'; },
  m3hToGpm:v=>v*4.40287, gpmToM3h:v=>v/4.40287,
  m3hToLmin:v=>v*16.6667, lminToM3h:v=>v/16.6667,
};

// Pressure units, each defined by its factor to convert TO bar (bar is the pivot unit).
const PRESSURE_UNITS = [
  {code:'bar',   label:'bar',      toBar:v=>v,          fromBar:b=>b},
  {code:'psi',   label:'psi',      toBar:v=>v/14.5038,  fromBar:b=>b*14.5038},
  {code:'kpa',   label:'kPa',      toBar:v=>v/100,      fromBar:b=>b*100},
  {code:'mpa',   label:'MPa',      toBar:v=>v*10,       fromBar:b=>b/10},
  {code:'atm',   label:'atm',      toBar:v=>v*1.01325,  fromBar:b=>b/1.01325},
  {code:'kgcm2', label:'kgf/cm\u00B2', toBar:v=>v*0.980665, fromBar:b=>b/0.980665},
  {code:'mmhg',  label:'mmHg',     toBar:v=>v/750.062,  fromBar:b=>b*750.062},
];
function pressureConvert(value, fromCode, toCode){
  const from = PRESSURE_UNITS.find(u=>u.code===fromCode);
  const to = PRESSURE_UNITS.find(u=>u.code===toCode);
  if(!from || !to || isNaN(value)) return null;
  const bar = from.toBar(value);
  return to.fromBar(bar);
}

/* ---------------------------- COST MODEL ---------------------------- */
/*
   Relative installed-cost model for ranking only. These are NOT supplier prices.
   Lower numbers are cheaper. Engineering constraints are always checked first;
   cost only decides between technically acceptable candidates. Replace these
   indexes with your own supplier/ERP prices when available.
*/
const COST_INDEX = {
  body:{BRASS:1.00,CI:1.08,CS:1.12,AL:1.18,BRONZE:1.22,PVC:1.28,PP:1.32,CPVC:1.38,SS304:1.70,DUPLEX:2.20,SS316:2.45,PVDF:2.60},
  seat:{NYLON:0.78,EPDM:0.85,PTFE:0.95,RPTFE:1.10,METAL:1.35,PEEK:2.50},
  seal:{NBR:0.70,EPDM:0.82,PU:0.88,SIL:1.00,PTFE:1.15,FKM:1.80},
  valve:{ball:1.00,butterfly:1.08,gate:1.10,plug:1.15,diaphragm:1.25},
  pressure:{PN6:1.00,PN10:1.05,PN16:1.12,PN25:1.25,PN40:1.45,CL150:1.30,CL300:1.70}
};
function candidateCostIndex(vtKey,bodyCode,seatCode,sealCode,classCode){
  return (COST_INDEX.valve[vtKey]||1) * (COST_INDEX.body[bodyCode]||1.5) *
         (COST_INDEX.seat[seatCode]||1.5) * (COST_INDEX.seal[sealCode]||1.2) *
         (COST_INDEX.pressure[classCode]||1.25);
}
function costTier(index){
  if(index<=1.05) return 'Low cost';
  if(index<=1.35) return 'Moderate cost';
  if(index<=1.75) return 'Higher cost';
  return 'Premium cost';
}

/* ---------------------------- DECISION ENGINE ---------------------------- */
/*
  For the selected function + medium + conditions, generate scored valve
  candidates across valve type / body material / seat material / seal
  material combinations, with a transparent reasoning trail for each.
*/
function runEngine(sel){
  const media = findMedia(sel.mediaId);
  if(!media) return [];
  const results = [];

  Object.keys(VALVE_TYPES).forEach(vtKey=>{
    const vt = VALVE_TYPES[vtKey];
    const fnFit = vt.functionFit[sel.fn] || 'Poor';

    vt.bodyMaterials.forEach(bodyCode=>{
      const bodyRating = media.compat[bodyCode];
      if(bodyRating===undefined || bodyRating<2) return;

      // IMPORTANT: in cost-effective mode we must evaluate ALL compatible
      // seat/seal combinations. Previously the engine picked the highest-rated
      // seat and seal first, which could force an unnecessarily expensive
      // material such as PEEK even when a cheaper technically acceptable
      // option (e.g. NBR) existed.
      const seatOptions = vt.seatMaterials
        .map(seatCode=>({code:seatCode,rating:media.compat[seatCode]}))
        .filter(x=>x.rating!==undefined && x.rating>=2);
      const sealOptions = vt.sealMaterials
        .map(sealCode=>({code:sealCode,rating:media.compat[sealCode]}))
        .filter(x=>x.rating!==undefined && x.rating>=2);
      if(!seatOptions.length || !sealOptions.length) return;

      seatOptions.forEach(seat=>{
        sealOptions.forEach(seal=>{
          // ---- pressure class ----
          let clsCode = sel.pressureClass;
          if(!clsCode){
            clsCode = PRESSURE_CLASSES.find(c=>ratedPressureAtTemp(c.code,bodyCode,sel.tempMaxC)>=sel.presMaxBar)?.code
                      || PRESSURE_CLASSES[PRESSURE_CLASSES.length-1].code;
          }
          const ratedAtTemp = ratedPressureAtTemp(clsCode, bodyCode, sel.tempMaxC);
          const presOk = ratedAtTemp>=sel.presMaxBar;

          // ---- temperature ----
          const compLimit = Math.min(matTemp('body',bodyCode), matTemp('seat',seat.code), matTemp('seal',seal.code));
          const tempOk = sel.tempMaxC<=compLimit;

          // ---- engineering suitability score ----
          const reasons = { media:[], temp:[], pressure:[], fn:[], risk:[] };
          let score = 0;

          const bodyPts = {4:30,3:22,2:12,0:0}[bodyRating] ?? 0;
          const seatPts = {4:20,3:15,2:8,0:0}[seat.rating] ?? 0;
          const sealPts = {4:15,3:11,2:6,0:0}[seal.rating] ?? 0;
          score += bodyPts+seatPts+sealPts;
          reasons.media.push({ok:bodyRating>=3,label:`Body — ${matName('body',bodyCode)}`,detail:RATING_LABEL[bodyRating]});
          reasons.media.push({ok:seat.rating>=3,label:`Seat — ${matName('seat',seat.code)}`,detail:RATING_LABEL[seat.rating]});
          reasons.media.push({ok:seal.rating>=3,label:`Seal — ${matName('seal',seal.code)}`,detail:RATING_LABEL[seal.rating]});
          if(media.maxRatedTempC && sel.tempMaxC>media.maxRatedTempC){
            reasons.risk.push(`Media compatibility ratings are referenced up to ~${media.maxRatedTempC}\u00B0C — verify chemical resistance at the full selected temperature.`);
          }

          score += tempOk ? 15 : Math.max(0, 15 - (sel.tempMaxC-compLimit)*2);
          reasons.temp.push({ok:tempOk, label:'Maximum selected temperature', value:`${sel.tempMaxC}\u00B0C`});
          reasons.temp.push({ok:tempOk, label:'Component limit (lowest of body/seat/seal)', value:`${compLimit}\u00B0C`});

          score += presOk ? 15 : Math.max(0,15-(sel.presMaxBar-ratedAtTemp)*3);
          reasons.pressure.push({ok:true, label:'Required (max operating)', value:`${sel.presMaxBar} bar`});
          reasons.pressure.push({ok:presOk, label:`Selected rating (${clsCode} @ ${sel.tempMaxC}\u00B0C)`, value:`${ratedAtTemp} bar`});

          const fitPts = {Excellent:5,Good:4,Fair:2,Poor:0}[fnFit] ?? 0;
          score += fitPts;
          reasons.fn.push({ok:fnFit==='Excellent'||fnFit==='Good', label:`Suitable for ${FUNCTIONS[sel.fn]?.name.toLowerCase()||sel.fn}`, value:fnFit});

          if(media.concentration){
            reasons.risk.push(`Concentration must be verified — compatibility ratings assume ~${sel.concentration ?? media.concentration.default}% ${media.name}.`);
          }
          if(media.hazard && media.hazard.length){
            media.hazard.forEach(h=>reasons.risk.push(`Hazard note: ${h}.`));
          }
          reasons.risk.push('Final pressure–temperature rating must be confirmed against manufacturer data.');

          score = Math.max(0, Math.min(100, Math.round(score)));

          const costIndex = candidateCostIndex(vtKey, bodyCode, seat.code, seal.code, clsCode);
          const engineeringAcceptable = bodyRating>=3 && seat.rating>=3 && seal.rating>=3 && tempOk && presOk && fnFit!=='Poor';
          reasons.cost = [
            {ok:true, label:'Relative cost index', value:costIndex.toFixed(2)},
            {ok:engineeringAcceptable, label:'Cost optimization gate', value:engineeringAcceptable?'Technically acceptable':'Needs engineering review'}
          ];

          results.push({
            id:`${vtKey}-${bodyCode}-${seat.code}-${seal.code}`,
            valveType:vtKey, valveTypeName:vt.name,
            bodyCode, seatCode:seat.code, sealCode:seal.code,
            bodyRating, seatRating:seat.rating, sealRating:seal.rating,
            score, tempOk, presOk, fnFit,
            pressureClassUsed:clsCode, ratedAtTemp, compLimit,
            costIndex, costTier:costTier(costIndex), engineeringAcceptable,
            reasons
          });
        });
      });
    });
  });

  // Cost-effective mode: hard-gate engineering acceptability first, then
  // minimize the COMPLETE valve assembly cost (body + seat + seal + type +
  // pressure class). This is deliberately not based on the engineering score.
  const acceptable = results.filter(r=>r.engineeringAcceptable);
  const pool = (sel.recommendationMode==='cost' && acceptable.length) ? acceptable : results;
  const bestByType = new Map();
  pool.forEach(r=>{
    const cur = bestByType.get(r.valveType);
    const better = !cur || (sel.recommendationMode==='cost'
      ? (r.costIndex < cur.costIndex || (r.costIndex===cur.costIndex && r.score>cur.score))
      : (r.score>cur.score || (r.score===cur.score && r.costIndex<cur.costIndex)));
    if(better) bestByType.set(r.valveType,r);
  });

  const deduped = [...bestByType.values()].sort((a,b)=> sel.recommendationMode==='cost'
    ? (a.costIndex-b.costIndex || b.score-a.score)
    : (b.score-a.score || a.costIndex-b.costIndex));
  return deduped.slice(0,6);
}

function scoreClass(score){
  if(score>=80) return 's-high';
  if(score>=60) return 's-mid';
  return 's-low';
}

/* ---------------------------- UI HELPERS ---------------------------- */
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.childNodes.length===1 ? d.firstChild : d; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTemp(c){ return state.units.temp==='F' ? `${Math.round(Convert.cToF(c))}\u00B0F` : `${c}\u00B0C`; }
function fmtPressure(b){ return state.units.pressure==='psi' ? `${Math.round(Convert.barToPsi(b))} psi` : `${b} bar`; }
function fmtSize(dn){ return state.units.size==='NPS' ? Convert.dnToNps(dn) : `DN${dn}`; }
function toast(msg){
  const t = el(`<div class="toast">${esc(msg)}</div>`);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function go(screen){ state.screen=screen; state.modal=null; render(); window.scrollTo(0,0); }
function renameProject(){
  const name = window.prompt('Project name', state.selection.projectName||'Untitled selection');
  if(name && name.trim()){ state.selection.projectName = name.trim(); render(); }
}
function saveProject(){
  state.modal='saveProject';
  render();
  setTimeout(()=>{
    const input=document.getElementById('projectSaveName');
    if(input){ input.focus(); input.select(); }
  },0);
}

function writeProjectFromInput(){
  const input=document.getElementById('projectSaveName');
  const name=(input?.value||'').trim();
  if(!name){ toast('Please enter a project name.'); input?.focus(); return false; }
  const copy=JSON.parse(JSON.stringify(state.selection));
  copy.projectName=name;
  copy.savedAt=new Date().toISOString();
  const existingIdx=state.projects.findIndex(p=>p.projectName.toLowerCase()===name.toLowerCase());
  if(existingIdx>=0) state.projects[existingIdx]=copy; else state.projects.push(copy);
  state.selection.projectName=name;
  persistProjects();
  return true;
}

function confirmSaveProject(){
  if(writeProjectFromInput()){ state.modal=null; render(); toast(`Project "${state.selection.projectName}" saved.`); }
}

function confirmSaveProjectAndOpen(){
  if(writeProjectFromInput()){ state.modal=null; go('projects'); }
}

function openSavedProjects(){ state.modal=null; go('projects'); }
function openModal(name){ state.modal=name; render(); }
function closeModal(){ state.modal=null; render(); }

const WIZARD_STEPS = [
  {key:'function', label:'Valve function', screen:'function'},
  {key:'medium', label:'Medium', screen:'medium'},
  {key:'mediumDetails', label:'Medium details', screen:'mediumDetails'},
  {key:'conditions', label:'Operating conditions', screen:'conditions'},
  {key:'installation', label:'Installation', screen:'installation'},
  {key:'results', label:'Valve selection', screen:'results'},
];
function wizardIndex(){ return WIZARD_STEPS.findIndex(s=>s.screen===state.screen); }

/* ---------------------------- ROOT RENDER ---------------------------- */
function render(){
  const app = document.getElementById('app');
  const inWizard = WIZARD_STEPS.some(s=>s.screen===state.screen) || ['why','spec','compare','report'].includes(state.screen);
  app.innerHTML = '';
  app.appendChild(renderTopbar());

  const shell = el(`<div class="shell"></div>`);
  if(inWizard) shell.appendChild(renderRail());
  const main = el(`<div class="main ${inWizard?'':''}"></div>`);
  main.appendChild(renderScreen());
  shell.appendChild(main);
  app.appendChild(shell);
  app.appendChild(renderBottomNav());

  if(state.modal) app.appendChild(renderModal());
}

function renderBottomNav(){
  const inNewFlow = WIZARD_STEPS.some(s=>s.screen===state.screen) || ['why','spec','compare','report','mediumDetails'].includes(state.screen);
  const items = [
    {key:'home',   icon:'\u2302', label:'Home',     active: state.screen==='home',     action:()=>go('home')},
    {key:'new',    icon:'+',      label:'New',      active: inNewFlow,                 action:()=>startNewSelection()},
    {key:'projects',icon:'\u25A4',label:'Projects', active: state.screen==='projects', action:()=>go('projects')},
    {key:'saved',  icon:'\u2605', label:'Saved',    active: state.screen==='savedValves', action:()=>go('savedValves')},
  ];
  const nav = el(`<div class="bottom-nav"></div>`);
  items.forEach(it=>{
    const item = el(`
      <div class="nav-item ${it.active?'active':''}">
        <span class="nav-icon">${it.icon}</span>
        <span class="nav-label">${it.label}</span>
      </div>
    `);
    item.onclick = it.action;
    nav.appendChild(item);
  });
  return nav;
}

function renderRail(){
  const idx = wizardIndex();
  const extra = ['why','spec','compare','report'].includes(state.screen);
  const rail = el(`<div class="rail"></div>`);
  WIZARD_STEPS.forEach((s,i)=>{
    const done = i<idx || (extra); const active = i===idx && !extra;
    const step = el(`
      <div class="rail-step ${active?'active':''} ${done?'done':''}">
        <span class="num">${done?'\u2713':i+1}</span>
        <span>${esc(s.label)}</span>
      </div>
    `);
    if(done) step.onclick=()=>go(s.screen);
    rail.appendChild(step);
  });
  if(extra){
    const labels={why:'Why?',spec:'Specification',compare:'Compare',report:'Report'};
    let n=0;
    ['why','spec','compare','report'].forEach(scr=>{
      n++;
      const active = state.screen===scr;
      const step = el(`
        <div class="rail-step ${active?'active':''} done">
          <span class="num">${active?n:'\u2713'}</span><span>${labels[scr]}</span>
        </div>`);
      step.onclick=()=>go(scr);
      rail.appendChild(step);
    });
  }
  return rail;
}

function renderScreen(){
  switch(state.screen){
    case 'home': return renderHome();
    case 'function': return renderFunctionScreen();
    case 'medium': return renderMediumScreen();
    case 'mediumDetails': return renderMediumDetailsScreen();
    case 'conditions': return renderConditionsScreen();
    case 'installation': return renderInstallationScreen();
    case 'results': return renderResultsScreen();
    case 'why': return renderWhyScreen();
    case 'spec': return renderSpecScreen();
    case 'compare': return renderCompareScreen();
    case 'report': return renderReportScreen();
    case 'materialDb': return renderMaterialDbScreen();
    case 'projects': return renderProjectsScreen();
    case 'savedValves': return renderSavedValvesScreen();
    default: return renderHome();
  }
}

/* ---------------------------- SCREEN 1: HOME ---------------------------- */
function renderHome(){
  const wrap = el(`<div class="wrap"></div>`);
  wrap.appendChild(el(`
    <div class="home-hero">
      <div>
        <h1>ValveSelect</h1>
        <div class="sub">Select the right valve before you buy the wrong one.</div>
        <div class="sub" style="margin-top:8px;font-size:12.5px;">
          \u25B6 Watch the how-to video and get app updates on the
          <a href="https://www.youtube.com/@IngaElectronics" target="_blank" rel="noopener" style="color:#fff;font-weight:600;text-decoration:underline;">Inga Electronics YouTube channel</a>.
        </div>
      </div>
      <button class="cta" onclick="startNewSelection()">+ New Valve Selection</button>
    </div>
  `));

  const grid = el(`<div class="grid"></div>`);
  const cards = [
    {icon:'+', title:'New Valve Selection', body:'Walk through function, medium, conditions and installation to get scored, explained recommendations.', action:()=>startNewSelection()},
    {icon:'\u25A4', title:'My Projects', body:'Resume a saved selection or start a new one from a previous project.', count:`${state.projects.length} saved`, action:()=>go('projects')},
    {icon:'\u2605', title:'Saved Valves', body:'Bookmarked candidates from any project, ready to compare or report on.', count:`${state.savedValves.length} saved`, action:()=>go('savedValves')},
  ];
  cards.forEach(c=>{
    const card = el(`
      <div class="card">
        <div class="icon">${c.icon}</div>
        <h3>${esc(c.title)}</h3>
        <p>${esc(c.body)}</p>
        ${c.count?`<span class="count">${esc(c.count)}</span>`:''}
      </div>
    `);
    card.onclick=c.action;
    grid.appendChild(card);
  });
  wrap.appendChild(grid);

  const dbCard = el(`
    <div class="card" style="margin-bottom:24px;">
      <div class="icon">\u2261</div>
      <h3>Material &amp; Media Database</h3>
      <p>Type a medium to see its recommended body, seat and seal materials, or browse all ${allMedia().length} media entries and compatibility ratings used by the engine.</p>
    </div>
  `);
  dbCard.onclick=()=>go('materialDb');
  wrap.appendChild(dbCard);

  wrap.appendChild(el(`<div class="section-label">QUICK TOOLS</div>`));
  const tools = el(`<div class="grid tools"></div>`);
  const cv = el(`<div class="card"><div class="icon">\u222B</div><h3>Cv / Kv Calculator</h3><p>Estimate flow coefficient from flow rate (L/min), medium specific gravity and differential pressure.</p></div>`);
  cv.onclick=()=>openModal('cvkv');
  const pc = el(`<div class="card"><div class="icon">\u21C4</div><h3>Pressure Conversion</h3><p>Convert between bar, psi, kPa, MPa, atm, kgf/cm\u00B2 and mmHg — any unit to any unit.</p></div>`);
  pc.onclick=()=>openModal('presconv');
  tools.appendChild(cv); tools.appendChild(pc);
  wrap.appendChild(tools);

  wrap.appendChild(el(`
    <div class="footnote" style="margin-top:28px;font-size:11px;line-height:1.5;color:#8A9C9A;max-width:760px;">
      <b>Supplier cross-reference:</b> Once ValveSelect has made a selection, you may take the report to your valve supplier and ask them to cross-reference the selection and provide a valve matching the specifications detailed in the report. The supplier should confirm the final manufacturer's specifications, ratings and suitability.
    </div>
  `));

  return wrap;
}

function startNewSelection(){
  state.selection = freshSelection();
  state.candidates = [];
  state.compareSet = [];
  go('function');
}

/* ---------------------------- SCREEN 2: FUNCTION ---------------------------- */
function renderFunctionScreen(){
  const wrap = el(`<div class="wrap"></div>`);
  wrap.appendChild(el(`
    <div class="section-label">STEP 1 OF 6</div>
    <h1>What is the valve function?</h1>
    <p class="subtitle">This decides which valve families are even considered — an isolation duty and a control duty favour different geometries.</p>
  `));

  const tiles = el(`<div class="tiles" style="margin-bottom:28px;"></div>`);
  Object.keys(FUNCTIONS).forEach(key=>{
    const f = FUNCTIONS[key];
    const disabled = key!=='isolation';
    const tile = el(`
      <div class="tile ${state.selection.fn===key?'selected':''}" style="${disabled?'opacity:.5;cursor:not-allowed;':''}">
        <span class="glyph">${key==='isolation'?'\u25A3':key==='control'?'\u2699':'\u21BA'}</span>
        <h4>${esc(f.name)}</h4>
        <p>${esc(f.desc)}</p>
        ${f.v2?'<span class="fit Fair" style="margin-top:10px;">Coming in Version 2</span>':''}
      </div>
    `);
    if(!disabled) tile.onclick=()=>{ state.selection.fn=key; render(); };
    tiles.appendChild(tile);
  });
  wrap.appendChild(tiles);

  if(Object.values(FUNCTIONS).some(f=>f.v2)){
    wrap.appendChild(el(`
      <div class="disclaimer" style="margin-top:-10px;">
        <b>Note</b>
        Control / Throttling and Non-return (Check) valve functions are not yet evaluated by this tool. Selection logic for these duties will be released with Version 2 of ValveSelect — for now, please continue with Isolation duty.
      </div>
    `));
  }

  if(state.selection.fn==='isolation'){
    wrap.appendChild(el(`<div class="section-label">SUITABLE VALVE FAMILIES FOR ISOLATION</div>`));
    const vgrid = el(`<div class="tiles"></div>`);
    Object.keys(VALVE_TYPES).forEach(k=>{
      const vt = VALVE_TYPES[k];
      const fit = vt.functionFit.isolation;
      const tile=el(`
        <div class="tile ${state.selection.valveTypeHint===k?'selected':''}" tabindex="0" role="button" aria-pressed="${state.selection.valveTypeHint===k}">
          <span class="glyph">${vt.glyph}</span>
          <h4>${esc(vt.name)}</h4>
          <p>${esc(vt.blurb)}</p>
          <span class="fit ${fit}">${fit} fit</span>
        </div>
      `);
      const selectValve=()=>{
        state.selection.valveTypeHint=(state.selection.valveTypeHint===k)?null:k;
        render();
      };
      tile.onclick=selectValve;
      tile.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectValve(); } };
      vgrid.appendChild(tile);
    });
    wrap.appendChild(vgrid);
  }

  const nav = el(`<div class="btn-row"></div>`);
  const back = el(`<button class="btn secondary" onclick="go('home')">\u2190 Back to home</button>`);
  const next = el(`<button class="btn" ${state.selection.fn?'':'disabled'}>Continue \u2192</button>`);
  if(state.selection.fn) next.onclick=()=>go('medium');
  nav.appendChild(back); nav.appendChild(next);
  wrap.appendChild(nav);
  return wrap;
}

/* ---------------------------- SCREEN 3: MEDIUM SEARCH ---------------------------- */
function renderMediumScreen(){
  const wrap = el(`<div class="wrap"></div>`);
  wrap.appendChild(el(`
    <div class="section-label">STEP 2 OF 6</div>
    <h1>Select the medium</h1>
    <p class="subtitle">Search Inga Electronics' chemical compatibility database. Ratings cover body, seat and seal materials.</p>
  `));

  const box = el(`
    <div class="search-box">
      <span class="sicon">\u{1F50D}</span>
      <input type="text" id="mediumSearch" placeholder="Type medium... e.g. sulfuric, ammonia, water" autocomplete="off" value="${state.mediumQuery?esc(state.mediumQuery):''}"/>
    </div>
  `);
  wrap.appendChild(box);

  const resultsHost = el(`<div id="mediumResultsHost"></div>`);
  wrap.appendChild(resultsHost);

  function doSearch(q){
    state.mediumQuery = q;
    const query = (q||'').trim().toLowerCase();
    resultsHost.innerHTML='';
    if(!query){
      const hint = el(`<div class="no-match" style="text-align:left;">
        <div class="section-label" style="margin-bottom:10px;">BROWSE BY CATEGORY</div>
        <div class="tiles" id="catTiles"></div>
      </div>`);
      resultsHost.appendChild(hint);
      const cats = [...new Set(allMedia().map(m=>m.category))];
      const ct = hint.querySelector('#catTiles');
      cats.forEach(c=>{
        const t = el(`<div class="tile" style="padding:12px 14px;"><h4 style="font-size:13px;">${esc(c)}</h4><p>${allMedia().filter(m=>m.category===c).length} media</p></div>`);
        t.onclick=()=>{ document.getElementById('mediumSearch').value=c; doSearch(c); };
        ct.appendChild(t);
      });
      return;
    }
    const matches = allMedia().filter(m=>
      m.name.toLowerCase().includes(query) || m.category.toLowerCase().includes(query) || (m.aliases||[]).some(a=>a.toLowerCase().includes(query))
    );
    if(matches.length===0){
      resultsHost.appendChild(el(`
        <div class="no-match">
          <div style="font-size:26px;">\u2205</div>
          <div>No medium matches "<b>${esc(q)}</b>" in the database.</div>
          <div class="btn" id="createCustomBtn" style="margin-top:14px;display:inline-flex;">+ Create custom medium</div>
        </div>
      `));
      resultsHost.querySelector('#createCustomBtn').onclick=()=>openModal('customMedium');
    } else {
      const list = el(`<div class="suggest-list"></div>`);
      matches.slice(0,20).forEach(m=>{
        const item = el(`
          <div class="suggest-item">
            <div>
              <div class="nm">${esc(m.name)}</div>
              <div class="meta cat">${esc(m.category)} \u00B7 ${m.phase}${m.custom?' \u00B7 custom':''}</div>
            </div>
            <div>${m.hazard&&m.hazard.length?`<span class="chip hazard">\u26A0 ${esc(m.hazard[0])}</span>`:''}</div>
          </div>
        `);
        item.onclick=()=>selectMedium(m.id);
        list.appendChild(item);
      });
      resultsHost.appendChild(list);
      const foot = el(`<div style="margin-top:14px;text-align:center;">
        <span class="link" id="notFoundLink">Can't find your medium? Create a custom medium</span>
      </div>`);
      foot.querySelector('#notFoundLink').onclick=()=>openModal('customMedium');
      resultsHost.appendChild(foot);
    }
  }
  setTimeout(()=>{
    const input = document.getElementById('mediumSearch');
    input.focus();
    input.addEventListener('input', e=>doSearch(e.target.value));
    doSearch(state.mediumQuery||'');
  },0);

  const nav = el(`<div class="btn-row"></div>`);
  const back = el(`<button class="btn secondary" onclick="go('function')">\u2190 Back</button>`);
  nav.appendChild(back);
  wrap.appendChild(nav);
  return wrap;
}

function selectMedium(mediaId){
  const m = allMedia().find(x=>x.id===mediaId);
  if(!m) return;
  state.selection.mediaId = mediaId;
  state.selection.phase = m.phase;
  state.selection.concentration = m.concentration ? m.concentration.default : null;
  go('mediumDetails');
}

/* ---------------------------- SCREEN 5: OPERATING CONDITIONS ---------------------------- */
function renderConditionsScreen(){
  const s = state.selection;
  const wrap = el(`<div class="wrap"></div>`);
  wrap.appendChild(el(`
    <div class="section-label">STEP 4 OF 6</div>
    <h1>Operating conditions</h1>
    <p class="subtitle">Enter normal and maximum duty. The engine checks the worst case (maximum) against material and pressure-class limits.</p>
  `));

  // Display helpers: values are stored canonically in C / bar on state.selection;
  // inputs show the value converted to the currently-selected display unit.
  const dTemp = c => c==null ? '' : (state.units.temp==='F' ? Math.round(Convert.cToF(c)*10)/10 : c);
  const dPres = b => b==null ? '' : (state.units.pressure==='psi' ? Math.round(Convert.barToPsi(b)*10)/10 : b);
  const dFlow = v => v==null ? '' : v;

  const form = el(`<div></div>`);
  form.appendChild(el(`
    <div class="field-row">
      <label class="field">
        <span class="lab">Temperature — normal
          <span class="unit-toggle" id="tUnit">
            <button data-u="C" class="${state.units.temp==='C'?'active':''}">\u00B0C</button>
            <button data-u="F" class="${state.units.temp==='F'?'active':''}">\u00B0F</button>
          </span>
        </span>
        <input type="number" id="tempNormal" value="${dTemp(s.tempNormalC)}" placeholder="e.g. 40"/>
      </label>
      <label class="field">
        <span class="lab">Temperature — maximum</span>
        <input type="number" id="tempMax" value="${dTemp(s.tempMaxC)}" placeholder="e.g. 60"/>
      </label>
    </div>
    <div class="field-row">
      <label class="field">
        <span class="lab">Pressure — minimum
          <span class="unit-toggle" id="pUnit">
            <button data-u="bar" class="${state.units.pressure==='bar'?'active':''}">bar</button>
            <button data-u="psi" class="${state.units.pressure==='psi'?'active':''}">psi</button>
          </span>
        </span>
        <input type="number" id="presMin" value="${dPres(s.presMinBar)}" placeholder="e.g. 2"/>
      </label>
      <label class="field">
        <span class="lab">Pressure — maximum</span>
        <input type="number" id="presMax" value="${dPres(s.presMaxBar)}" placeholder="e.g. 10"/>
      </label>
    </div>
    <div class="field-row">
      <label class="field">
        <span class="lab">Line size
          <span class="unit-toggle" id="sUnit">
            <button data-u="DN" class="${state.units.size==='DN'?'active':''}">DN</button>
            <button data-u="NPS" class="${state.units.size==='NPS'?'active':''}">NPS</button>
          </span>
        </span>
        <select id="lineSize">
          ${SIZES.map(sz=>`<option value="${sz.dn}" ${s.lineSizeDN===sz.dn?'selected':''}>${state.units.size==='NPS'?sz.nps:'DN'+sz.dn} ${state.units.size==='NPS'?'(DN'+sz.dn+')':'('+sz.nps+')'}</option>`).join('')}
        </select>
      </label>
      <label class="field">
        <span class="lab">Flow rate (optional)
          <span class="unit-toggle" id="fUnit">
            <button data-u="m3h" class="${s.flowUnit==='m3h'?'active':''}">m\u00B3/h</button>
            <button data-u="lmin" class="${s.flowUnit==='lmin'?'active':''}">L/min</button>
            <button data-u="gpm" class="${s.flowUnit==='gpm'?'active':''}">GPM</button>
          </span>
        </span>
        <input type="number" id="flowVal" value="${dFlow(s.flow)}" placeholder="e.g. 25"/>
      </label>
    </div>
  `));
  wrap.appendChild(form);

  // Commit whatever is currently in the visible fields into canonical state (C / bar)
  // before switching units or leaving the screen, so nothing typed is lost.
  function commitFields(){
    const g=(id)=>{ const v=parseFloat(document.getElementById(id).value); return isNaN(v)?null:v; };
    const tn=g('tempNormal'), tm=g('tempMax');
    if(tn!==null) s.tempNormalC = state.units.temp==='F' ? Convert.fToC(tn) : tn;
    if(tm!==null) s.tempMaxC = state.units.temp==='F' ? Convert.fToC(tm) : tm;
    const pmin=g('presMin'), pmax=g('presMax');
    if(pmin!==null) s.presMinBar = state.units.pressure==='psi' ? Convert.psiToBar(pmin) : pmin;
    if(pmax!==null) s.presMaxBar = state.units.pressure==='psi' ? Convert.psiToBar(pmax) : pmax;
    const fv=g('flowVal'); s.flow = fv;
    const ls = document.getElementById('lineSize'); if(ls) s.lineSizeDN = parseInt(ls.value,10);
  }

  setTimeout(()=>{
    document.getElementById('tUnit').querySelectorAll('button').forEach(b=>b.onclick=()=>{ commitFields(); state.units.temp=b.dataset.u; render(); });
    document.getElementById('pUnit').querySelectorAll('button').forEach(b=>b.onclick=()=>{ commitFields(); state.units.pressure=b.dataset.u; render(); });
    document.getElementById('sUnit').querySelectorAll('button').forEach(b=>b.onclick=()=>{ commitFields(); state.units.size=b.dataset.u; render(); });
    document.getElementById('fUnit').querySelectorAll('button').forEach(b=>b.onclick=()=>{ commitFields(); s.flowUnit=b.dataset.u; render(); });
  },0);

  const nav = el(`<div class="btn-row"></div>`);
  const back = el(`<button class="btn secondary" onclick="go('mediumDetails')">\u2190 Back</button>`);
  const next = el(`<button class="btn">Continue \u2192</button>`);
  next.onclick=()=>{
    commitFields();
    if([s.tempNormalC,s.tempMaxC,s.presMinBar,s.presMaxBar].some(v=>v===null||v===undefined)){
      toast('Please complete all temperature and pressure fields.'); return;
    }
    go('installation');
  };
  nav.appendChild(back); nav.appendChild(next);
  wrap.appendChild(nav);
  return wrap;
}

}

function toggleCompare(id, checked){
  if(checked){ if(state.compareSet.length<5) state.compareSet.push(id); else { toast('You can compare up to 5 candidates.'); return; } }
  else { state.compareSet = state.compareSet.filter(x=>x!==id); }
  render();
}
function toggleSaved(id){
  if(state.savedValves.includes(id)) state.savedValves = state.savedValves.filter(x=>x!==id);
  else state.savedValves.push(id);
  render();
}
function openWhy(id){ state.activeCandidateId=id; go('why'); }
function openSpec(id){ state.activeCandidateId=id; go('spec'); }

/* ---------------------------- SCREEN 8: WHY? ---------------------------- */
function renderWhyScreen(){
  const c = state.candidates.find(x=>x.id===state.activeCandidateId) || state.candidates[0];
  const wrap = el(`<div class="wrap"></div>`);
  if(!c){ go('results'); return wrap; }
  wrap.appendChild(el(`

    <h1>${matName('body',c.bodyCode)} ${c.valveTypeName}</h1>

  const panel = el(`<div class="why-panel"></div>`);

  const mediaSec = el(`<div class="why-section"></div>`);
  mediaSec.appendChild(el(`<h4>Media compatibility</h4>`));
  c.reasons.media.forEach(r=>{
    mediaSec.appendChild(el(`<div class="why-verdict ${r.ok?'ok':'warn'}">${r.ok?'\u2713':'\u26A0'} ${esc(r.label)} \u2014 ${esc(r.detail)}</div>`));

  panel.appendChild(mediaSec);

  const tempSec = el(`<div class="why-section"></div>`);
  tempSec.appendChild(el(`<h4>Temperature</h4>`));
  c.reasons.temp.forEach(r=>{
    tempSec.appendChild(el(`<div class="why-row"><span class="lbl">${r.ok?'\u2713':'\u2717'} ${esc(r.label)}</span><span class="val">${esc(r.value)}</span></div>`));
  });
  panel.appendChild(tempSec);

  const presSec = el(`<div class="why-section"></div>`);
  presSec.appendChild(el(`<h4>Pressure</h4>`));
  c.reasons.pressure.forEach(r=>{
    presSec.appendChild(el(`<div class="why-row"><span class="lbl">${r.ok?'\u2713':'\u2717'} ${esc(r.label)}</span><span class="val">${esc(r.value)}</span></div>`));
  });
  presSec.appendChild(el(`<div class="score-formula">Rating derated from ${PRESSURE_CLASSES.find(x=>x.code===c.pressureClassUsed).bar20} bar @ 20\u00B0C to ${c.ratedAtTemp} bar @ ${state.selection.tempMaxC}\u00B0C using a simplified linear derate for ${matName('body',c.bodyCode)}.</div>`));
  panel.appendChild(presSec);

  const fnSec = el(`<div class="why-section"></div>`);

/* ---------------------------- SCREEN 10: COMPARE ---------------------------- */
function renderCompareScreen(){
  const items = state.compareSet.map(id=>state.candidates.find(c=>c.id===id) || findSavedCandidate(id)).filter(Boolean);
  const wrap = el(`<div class="wrap"></div>`);
  wrap.appendChild(el(`
    <div class="section-label">COMPARE CANDIDATES</div>
    <h1>Compare</h1>
    <p class="subtitle">Side-by-side comparison of ${items.length} selected candidate${items.length===1?'':'s'}.</p>
  `));

  if(items.length<2){
    wrap.appendChild(el(`<div class="empty-state"><div class="glyph">\u2245</div><p>Select at least two candidates from the results screen to compare.</p></div>`));
    const back = el(`<button class="btn secondary" onclick="go('results')">\u2190 Back to results</button>`);
    wrap.appendChild(back);
    return wrap;
  }

  const topScore = Math.max(...items.map(c=>c.score));

  // Row definitions. Each cell fn returns {text, cls} where cls is an optional extra class
  // (used to color pass/fail badges and material-rating text consistently with the rest of the app).
  const rowsDef = [
    ['Suitability score', c=>({html:`<span class="score-val">${c.score} / 100</span>`})],
    ['Valve type', c=>({text:c.valveTypeName})],
    ['Body material', c=>({text:matName('body',c.bodyCode)})],
    ['Seat material', c=>({text:matName('seat',c.seatCode)})],
    ['Seal material', c=>({text:matName('seal',c.sealCode)})],
    ['Pressure class', c=>({text:c.pressureClassUsed})],
    ['Rated pressure @ max temp', c=>({text:c.ratedAtTemp+' bar'})],
    ['Component temp limit', c=>({text:c.compLimit+'\u00B0C'})],
    ['Media compatibility (body)', c=>({html:`<span class="rating-val" style="color:${ratingColor(c.bodyRating)};">${esc(RATING_LABEL[c.bodyRating])}</span>`})],
    ['Temperature check', c=>({html:c.tempOk?`<span class="pf ok">\u2713 Pass</span>`:`<span class="pf bad">\u2717 Fail</span>`})],
    ['Pressure check', c=>({html:c.presOk?`<span class="pf ok">\u2713 Pass</span>`:`<span class="pf bad">\u2717 Fail</span>`})],
  ];

  // Build the whole table as a single HTML string. Rows/cells must be created together with
  // their parent <table> in one pass -- assembling <tr> fragments separately and appending them
  // afterwards is not reliable, since a bare <tr> string has no table to belong to when parsed.
  const theadCells = items.map(c=>{
    const isBest = c.score===topScore;
    return `<th class="colhead${isBest?' best-col':''}">
        <div class="cand-name">${esc(matName('body',c.bodyCode))} ${esc(c.valveTypeName)}</div>
        <div class="cand-sub">${esc(c.pressureClassUsed)} \u00B7 ${esc(matName('seat',c.seatCode))}</div>
        ${isBest?`<span class="best-badge">\u2605 TOP SCORE</span>`:''}
      </th>`;
  }).join('');

  const tbodyRows = rowsDef.map(([label,fn])=>{
    const cells = items.map(c=>{
      const isBest = c.score===topScore;
      const {text,html} = fn(c);
      return `<td class="${isBest?'best-col':''}">${html!==undefined?html:esc(text)}</td>`;
    }).join('');
    return `<tr><td class="rowlabel">${esc(label)}</td>${cells}</tr>`;
  }).join('');

  const tableHtml = `
    <table class="compare-table">
      <thead><tr><th class="corner">Parameter</th>${theadCells}</tr></thead>
      <tbody>${tbodyRows}</tbody>
    </table>`;
  const tableWrap = el(`<div class="compare-table-wrap"></div>`);
  tableWrap.appendChild(el(tableHtml));
  wrap.appendChild(tableWrap);
  wrap.appendChild(el(`<p class="subtitle" style="margin-top:12px;">The highlighted column is the highest-scoring candidate in this comparison.</p>`));

  const nav = el(`<div class="btn-row"></div>`);
  const back = el(`<button class="btn secondary" onclick="go('results')">\u2190 Back to results</button>`);
  const rep = el(`<button class="btn" onclick="go('report')">Generate report for top candidate \u2192</button>`);
  nav.appendChild(back); nav.appendChild(rep);
  wrap.appendChild(nav);
  return wrap;
}
function findSavedCandidate(id){ return state.candidates.find(c=>c.id===id); }

/* ---------------------------- MATERIAL & MEDIA DATABASE ---------------------------- */
function renderMaterialDbScreen(){
  if(!state.dbView) state.dbView = 'lookup'; // 'lookup' (cards) or 'matrix' (full table)
  const wrap = el(`<div class="wrap"></div>`);
  wrap.appendChild(el(`
    <div class="section-label">REFERENCE DATA</div>
    <h1>Material &amp; media database</h1>
    <p class="subtitle">${allMedia().length} media entries \u00B7 ${MATERIALS.body.length} body materials \u00B7 ${MATERIALS.seat.length} seat materials \u00B7 ${MATERIALS.seal.length} seal materials. Chemical resistance ratings are sourced from a Cole-Parmer chemical compatibility chart (16 materials: Aluminium, Brass, Carbon Steel, Cast Iron, EPDM, FKM/Viton, NBR, Nylon, Polypropylene, PEEK, Polyurethane, PTFE, Silicone, 304 &amp; 316 Stainless Steel). Duplex, Bronze, uPVC, CPVC, PVDF, reinforced PTFE and metal seats aren't covered by this chart, so candidates using those materials won't surface until ratings are added for them. Concentration and temperature notes from the source footnotes have been simplified — always confirm against the manufacturer's full chart before finalizing a spec.</p>
  `));

  const controls = el(`<div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap;"></div>`);
  const search = el(`<div class="search-box" style="flex:1;min-width:220px;margin-bottom:0;"><span class="sicon">\u{1F50D}</span><input type="text" id="dbSearch" placeholder="Type a medium — e.g. sulfuric, ammonia, water..." value="${state.dbQuery?esc(state.dbQuery):''}"/></div>`);
  const catSel = el(`<select id="dbCatSel" style="width:auto;min-width:160px;"><option value="">All categories</option>${[...new Set(allMedia().map(m=>m.category))].sort().map(c=>`<option value="${esc(c)}" ${state.dbCategory===c?'selected':''}>${esc(c)}</option>`).join('')}</select>`);
  controls.appendChild(search); controls.appendChild(catSel);
  wrap.appendChild(controls);

  const viewToggle = el(`
    <div class="unit-toggle" style="margin:12px 0 20px;">
      <button data-v="lookup" class="${state.dbView==='lookup'?'active':''}">Lookup by medium</button>
      <button data-v="matrix" class="${state.dbView==='matrix'?'active':''}">Full matrix</button>
    </div>
  `);
  viewToggle.querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.dbView=b.dataset.v; render(); });
  wrap.appendChild(viewToggle);

  const resultHost = el(`<div></div>`);
  wrap.appendChild(resultHost);

  const bodyCodes = MATERIALS.body.map(m=>m.code);

  function matches(){
    const q = (state.dbQuery||'').trim().toLowerCase();
    return allMedia().filter(m=>{
      const catOk = !state.dbCategory || m.category===state.dbCategory;
      const qOk = !q || m.name.toLowerCase().includes(q) || m.category.toLowerCase().includes(q) || (m.aliases||[]).some(a=>a.toLowerCase().includes(q));
      return catOk && qOk;
    });
  }

  function pickCol(list, n){
    // top rating tier, capped at n names, so ties all show together where possible
    if(!list.length) return '<span style="color:var(--ink-soft);">No rated option</span>';
    const top = list[0].rating;
    const tied = list.filter(x=>x.rating===top).slice(0,n);
    return tied.map(x=>`<div style="color:${ratingColor(x.rating)};font-weight:600;">${esc(x.name)}</div><div style="font-size:10.5px;color:var(--ink-soft);font-family:var(--mono);margin-bottom:4px;">${RATING_LABEL[x.rating]}</div>`).join('');
  }

  function drawLookup(){
    resultHost.innerHTML='';
    const ms = matches();
    if(ms.length===0){
      resultHost.appendChild(el(`<div class="no-match"><div style="font-size:26px;">\u2205</div><div>No medium matches "<b>${esc(state.dbQuery||'')}</b>".</div></div>`));
      return;
    }
    resultHost.appendChild(el(`<p class="subtitle" style="margin:0 0 14px;">${ms.length} medium${ms.length===1?'':'s'} \u00B7 showing the best-rated body / seat / seal material for each. Click a card for the full breakdown.</p>`));
    ms.slice(0,60).forEach(m=>{
      const best = bestMaterialsForMedia(m);
      const card = el(`
        <div class="card" style="cursor:pointer;margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
            <div>
              <h3 style="margin-bottom:2px;">${esc(m.name)}${m.custom?' <span class="chip info" style="vertical-align:middle;">custom</span>':''}</h3>
              <p style="margin:0;">${esc(m.category)} \u00B7 ${m.phase==='liquid'?'Liquid':'Gas'}</p>
            </div>
            ${m.hazard&&m.hazard.length?`<span class="chip hazard">\u26A0 ${esc(m.hazard[0])}</span>`:''}
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px;font-size:12.5px;">
            <div><div class="section-label" style="margin:0 0 6px;">BODY</div>${pickCol(best.body,2)}</div>
            <div><div class="section-label" style="margin:0 0 6px;">SEAT</div>${pickCol(best.seat,2)}</div>
            <div><div class="section-label" style="margin:0 0 6px;">SEAL</div>${pickCol(best.seal,2)}</div>
          </div>
          <div id="detail-${esc(m.id)}" style="display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;"></div>
        </div>
      `);
      card.addEventListener('click',(e)=>{
        const detail = card.querySelector(`#detail-${CSS.escape(m.id)}`);
        const open = detail.style.display!=='none';
        if(open){ detail.style.display='none'; detail.innerHTML=''; return; }
        detail.style.display='block';
        detail.innerHTML='';
        ['body','seat','seal'].forEach(kind=>{
          const list = best[kind];
          const col = el(`<div style="margin-bottom:10px;"><b style="font-size:11.5px;text-transform:uppercase;font-family:var(--mono);color:var(--ink-soft);">${kind}</b></div>`);
          if(!list.length){ col.appendChild(el(`<div style="font-size:12.5px;color:var(--ink-soft);">No rated materials in this chart for ${kind}.</div>`)); }
          list.forEach(x=>{
            col.appendChild(el(`<div class="why-row" style="border-bottom:1px dashed var(--line);"><span class="lbl">${esc(x.name)}</span><span class="val" style="color:${ratingColor(x.rating)};">${RATING_LABEL[x.rating]}</span></div>`));
          });
          detail.appendChild(col);
        });
      });
      resultHost.appendChild(card);
    });
  }

  function drawMatrix(){
    resultHost.innerHTML='';
    const ms = matches();
    const tableHost = el(`<div class="compare-table-wrap"></div>`);
    const bodyRowsHtml = ms.map(m=>{
      const cells = bodyCodes.map(c=>{
        const r=m.compat[c];
        return `<td style="color:${r===undefined?'var(--ink-soft)':ratingColor(r)};font-family:var(--mono);font-weight:600;">${r===undefined?'\u2014':RATING_LABEL[r][0]}</td>`;
      }).join('');
      return `<tr><td class="rowlabel">${esc(m.name)}</td>${cells}</tr>`;
    }).join('');
    const table = el(`
      <table class="compare-table">
        <thead><tr><th class="corner">Medium</th>${bodyCodes.map(c=>`<th class="colhead">${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${bodyRowsHtml}</tbody>
      </table>`);
    tableHost.appendChild(table);
    resultHost.appendChild(tableHost);
    resultHost.appendChild(el(`<p class="subtitle" style="margin-top:16px;">E = Excellent, G = Good, F = Fair, N = Not recommended. Columns show body material rating only; switch to "Lookup by medium" to see recommended seat and seal materials too.</p>`));
  }

  function draw(){ state.dbView==='matrix' ? drawMatrix() : drawLookup(); }
  setTimeout(()=>{
    draw();
    document.getElementById('dbSearch').addEventListener('input',e=>{ state.dbQuery=e.target.value; draw(); });
    document.getElementById('dbCatSel').addEventListener('change',e=>{ state.dbCategory=e.target.value; draw(); });
  },0);

  const back = el(`<button class="btn secondary" style="margin-top:20px;" onclick="go('home')">\u2190 Back to home</button>`);
  wrap.appendChild(back);
  return wrap;
}

  else if(state.modal==='presconv') inner = modalPresConv();
  else if(state.modal==='customMedium') inner = modalCustomMedium();
  else if(state.modal==='saveProject') inner = modalSaveProject();
  backdrop.appendChild(inner);
  return backdrop;
}

function modalSaveProject(){
  const m=el(`
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>Save project</h2>
      <p class="subtitle">Choose a name for this valve selection. Projects are saved on this device.</p>
      <label class="field">
        <span class="lab">Project name</span>
        <input type="text" id="projectSaveName" value="${esc(state.selection.projectName==='Untitled selection'?'':state.selection.projectName)}" placeholder="e.g. Cooling Water Line 01" maxlength="100"/>
      </label>
      <div class="btn-row" style="margin-top:18px;">
        <button class="btn secondary" onclick="closeModal()">Cancel</button>
        <div style="display:flex;gap:10px;">
          <button class="btn secondary" onclick="confirmSaveProject()">Save project</button>
          <button class="btn" onclick="confirmSaveProjectAndOpen()">Save &amp; view projects</button>
        </div>
      </div>
    </div>
  `);
  m.querySelector('#projectSaveName').onkeydown=(e)=>{ if(e.key==='Enter') confirmSaveProject(); };
  return m;
}

function modalCvKv(){
  const m = el(`
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">\u2715</button>
      <h2>Cv / Kv Calculator</h2>
      <p class="subtitle">Estimate the flow coefficient for liquid service: Kv = Q \u00D7 \u221A(SG / \u0394P)</p>
      <label class="field"><span class="lab">Flow rate Q (L/min)</span><input type="number" id="cvQ" placeholder="e.g. 200"/></label>
      <label class="field">
        <span class="lab">Medium (sets specific gravity)</span>
        <select id="cvMedia">${SG_PRESETS.map((p,i)=>`<option value="${i}">${esc(p.label)}${p.sg!==null?` (SG ${p.sg})`:''}</option>`).join('')}</select>
      </label>
      <label class="field"><span class="lab">Specific gravity (water = 1.0)</span><input type="number" id="cvSG" value="1.0" step="0.01"/></label>
      <label class="field"><span class="lab">Differential pressure \u0394P (bar)</span><input type="number" id="cvDp" placeholder="e.g. 1.5"/></label>
      <button class="btn" id="cvCalcBtn">Calculate</button>
      <div id="cvResult"></div>
      <p class="subtitle" style="margin-top:14px;font-size:11px;">Slurry specific gravity varies with solids concentration — treat the slurry presets as a starting point and confirm against a measured value where possible.</p>
    </div>
  `);
  const sgInput = m.querySelector('#cvSG');
  const mediaSel = m.querySelector('#cvMedia');
  mediaSel.onchange=()=>{
    const preset = SG_PRESETS[parseInt(mediaSel.value,10)];
    if(preset && preset.sg!==null){ sgInput.value = preset.sg; sgInput.disabled = true; }
    else { sgInput.disabled = false; sgInput.focus(); }
  };
  m.querySelector('#cvCalcBtn').onclick=()=>{
    const Q=parseFloat(m.querySelector('#cvQ').value), sg=parseFloat(sgInput.value), dp=parseFloat(m.querySelector('#cvDp').value);
    const res = m.querySelector('#cvResult');
    if(isNaN(Q)||isNaN(sg)||isNaN(dp)||dp<=0||Q<=0||sg<=0){ res.innerHTML='<div class="calc-result">Enter valid flow rate, specific gravity and \u0394P &gt; 0.</div>'; return; }
    const Qm3h = Q*0.06; // L/min -> m3/h
    const kv = Qm3h*Math.sqrt(sg/dp);
    const cv = kv/0.865;
    res.innerHTML = `<div class="calc-result">Kv \u2248 ${kv.toFixed(2)} m\u00B3/h &nbsp;\u00B7&nbsp; Cv \u2248 ${cv.toFixed(2)}</div>`;
  };
  return m;
}

function modalPresConv(){
  if(!state.presConvUnits) state.presConvUnits = {from:'bar', to:'psi'};
  const pu = state.presConvUnits;
  const opts = (selected)=>PRESSURE_UNITS.map(u=>`<option value="${u.code}" ${u.code===selected?'selected':''}>${esc(u.label)}</option>`).join('');
  const m = el(`
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">\u2715</button>
      <h2>Pressure Conversion</h2>
      <p class="subtitle">Convert a pressure value between any two units.</p>
      <div class="field-row">
        <label class="field">
          <span class="lab">From</span>
          <select id="pcFromUnit">${opts(pu.from)}</select>
        </label>
        <label class="field">
          <span class="lab">Value</span>
          <input type="number" id="pcVal" placeholder="e.g. 10"/>
        </label>
      </div>
      <label class="field">
        <span class="lab">To</span>
        <select id="pcToUnit">${opts(pu.to)}</select>
      </label>
      <button class="btn" id="pcBtn">Convert</button>
      <div id="pcResult"></div>
    </div>
  `);
  const fromSel = m.querySelector('#pcFromUnit');
  const toSel = m.querySelector('#pcToUnit');
  const valInput = m.querySelector('#pcVal');
  const res = m.querySelector('#pcResult');
  function doConvert(){
    const value = parseFloat(valInput.value);
    const fromCode = fromSel.value, toCode = toSel.value;
    state.presConvUnits = {from:fromCode, to:toCode};
    if(isNaN(value)){ res.innerHTML='<div class="calc-result">Enter a value to convert.</div>'; return; }
    const fromLabel = PRESSURE_UNITS.find(u=>u.code===fromCode).label;
    const toLabel = PRESSURE_UNITS.find(u=>u.code===toCode).label;
    if(fromCode===toCode){ res.innerHTML=`<div class="calc-result">${value} ${esc(fromLabel)} = ${value} ${esc(toLabel)}</div>`; return; }
    const out = pressureConvert(value, fromCode, toCode);
    const decimals = Math.abs(out) < 10 ? 3 : (Math.abs(out) < 1000 ? 2 : 0);
    res.innerHTML = `<div class="calc-result">${value} ${esc(fromLabel)} = ${out.toFixed(decimals)} ${esc(toLabel)}</div>`;
  }
  m.querySelector('#pcBtn').onclick=doConvert;
  fromSel.onchange=doConvert;
  toSel.onchange=doConvert;
  valInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doConvert(); });
  return m;
}

function modalCustomMedium(){
  const m = el(`
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">\u2715</button>
      <h2>Create custom medium</h2>
      <p class="subtitle">Add a medium not yet in the database. Set compatibility ratings for each body material — this becomes part of the searchable database immediately.</p>
      <label class="field"><span class="lab">Medium name</span><input type="text" id="cmName" placeholder="e.g. Proprietary Process Fluid X"/></label>
      <label class="field"><span class="lab">Category</span><input type="text" id="cmCat" placeholder="e.g. Custom / Process fluid"/></label>
      <label class="field"><span class="lab">Phase</span>
        <select id="cmPhase"><option value="liquid">Liquid</option><option value="gas">Gas</option></select>
      </label>
      <div class="section-label" style="margin-top:16px;">BODY MATERIAL COMPATIBILITY (default: Fair — adjust as known)</div>
      <div id="cmMatGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
        ${MATERIALS.body.map(bm=>`
          <label class="field" style="margin-bottom:0;">
            <span class="lab" style="font-weight:400;">${bm.name}</span>
            <select data-code="${bm.code}" class="cmMatSel">
              <option value="4">Excellent</option><option value="3">Good</option><option value="2" selected>Fair</option><option value="0">Not recommended</option>
            </select>
          </label>
        `).join('')}
      </div>
      <button class="btn" id="cmSaveBtn">Add to database &amp; select</button>
    </div>
  `);
  m.querySelector('#cmSaveBtn').onclick=()=>{
    const name = m.querySelector('#cmName').value.trim();
    if(!name){ toast('Enter a medium name.'); return; }
    const compat = {PTFE:3,RPTFE:3,PEEK:3,NYLON:2,METAL:2,EPDM:2,FKM:3,NBR:2,SIL:2}; // conservative default for non-body materials
    m.querySelectorAll('.cmMatSel').forEach(sel=>{ compat[sel.dataset.code]=parseInt(sel.value,10); });
    const id = 'custom_'+Date.now();
    const medium = {
      id, name, category: m.querySelector('#cmCat').value.trim()||'Custom', phase: m.querySelector('#cmPhase').value,
      hazard:['User-defined — verify all ratings'], concentration:null, maxRatedTempC:100, compat, custom:true
    };
    state.customMedia.push(medium);
    toast('Custom medium added to the database.');
    selectMedium(id);
  };
  return m;
}

/* ---------------------------- INIT ---------------------------- */
render();
</script>
